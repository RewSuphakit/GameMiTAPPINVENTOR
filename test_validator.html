<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Tests: App Inventor Code Breaker v3.0</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            padding: 30px;
            line-height: 1.6;
        }
        h1 { color: #38bdf8; margin-bottom: 8px; }
        .summary-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            display: flex;
            gap: 30px;
        }
        .stat-box { font-size: 0.9rem; }
        .stat-value { font-size: 2rem; font-weight: 800; }
        .stat-passed { color: #34d399; }
        .stat-failed { color: #f43f5e; }
        .test-list { display: flex; flex-direction: column; gap: 10px; }
        .test-item {
            background: #1e293b;
            border-left: 5px solid #64748b;
            border-radius: 6px;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .test-item.pass { border-left-color: #34d399; }
        .test-item.fail { border-left-color: #f43f5e; background: #3b111e; }
        .test-title { font-weight: 600; font-size: 0.95rem; }
        .test-msg { font-size: 0.8rem; color: #f87171; margin-top: 4px; }
        .badge {
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .badge.pass { background: rgba(52, 211, 153, 0.2); color: #34d399; }
        .badge.fail { background: rgba(244, 63, 94, 0.2); color: #f43f5e; }
        #sandbox { display: none; }
    </style>
</head>
<body>
    <h1>🧪 Test Suite: App Inventor IDE Engine v3.0</h1>
    <p style="color: #94a3b8; margin-bottom: 20px;">ชุดทดสอบอัตโนมัติสำหรับ GenericValidator, Gamification, Levels Data Schema, และ Security Utils</p>

    <div class="summary-card">
        <div class="stat-box">
            <div style="color: #94a3b8;">Total Tests</div>
            <div class="stat-value" id="total-count">0</div>
        </div>
        <div class="stat-box">
            <div style="color: #94a3b8;">Passed</div>
            <div class="stat-value stat-passed" id="pass-count">0</div>
        </div>
        <div class="stat-box">
            <div style="color: #94a3b8;">Failed</div>
            <div class="stat-value stat-failed" id="fail-count">0</div>
        </div>
        <div class="stat-box">
            <div style="color: #94a3b8;">Status</div>
            <div class="stat-value" id="test-status">Running...</div>
        </div>
    </div>

    <div class="test-list" id="test-list"></div>
    <div id="sandbox"></div>

    <script type="module">
        import { GenericValidator } from './js/validator.js';
        import { LEVEL_SCHEMA } from './js/levels.data.js';
        import { Gamification } from './js/gamification.js';
        import { Utils } from './js/utils.js';

        const tests = [];
        let passed = 0, failed = 0;

        function it(name, fn) {
            tests.push({ name, fn });
        }

        function assert(condition, message) {
            if (!condition) throw new Error(message || 'Assertion failed');
        }

        function assertEqual(actual, expected, message) {
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
                throw new Error(`${message || 'Failed'}: Expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
            }
        }

        const sandbox = document.getElementById('sandbox');

        // ==========================================
        // 1. DATA SCHEMA TESTS
        // ==========================================
        it('Schema: Exactly 8 Levels are configured with variants and 3 hint tiers', () => {
            const levelKeys = Object.keys(LEVEL_SCHEMA);
            assertEqual(levelKeys.length, 8, 'Must have exactly 8 levels');
            levelKeys.forEach(k => {
                const lvl = LEVEL_SCHEMA[k];
                assert(lvl.hints && lvl.hints.length === 3, `Level ${k} must have exactly 3 hint tiers`);
                assert(lvl.variants && lvl.variants.length >= 1, `Level ${k} must have variants`);
            });
        });

        // ==========================================
        // 2. GENERIC VALIDATOR TESTS
        // ==========================================
        it('Validator: cavity-has-correct detects correct block in cavity', () => {
            sandbox.innerHTML = `<div class="ai-c-cavity" id="l1-cavity"><div class="ai-block" data-type="correct">Correct</div></div>`;
            const res = GenericValidator.validate(1, 0);
            assert(res.isValid, 'Should validate successfully');
            assert(!res.isDecoy, 'Should not be flagged as decoy');
        });

        it('Validator: cavity-has-correct catches decoy blocks', () => {
            sandbox.innerHTML = `<div class="ai-c-cavity" id="l1-cavity"><div class="ai-block" data-decoy="true">Decoy</div></div>`;
            const res = GenericValidator.validate(1, 0);
            assert(!res.isValid, 'Should fail validation');
            assert(res.isDecoy, 'Should identify as decoy');
        });

        it('Validator: sockets-match detects left and right sockets', () => {
            sandbox.innerHTML = `
                <div class="ai-socket" id="l2-s1"><div class="ai-block" data-type="c1">Var</div></div>
                <div class="ai-socket" id="l2-s2"><div class="ai-block" data-type="c2">5</div></div>
            `;
            const res = GenericValidator.validate(2, 0);
            assert(res.isValid, 'Both sockets match criteria');
        });

        it('Validator: debug-replace requires removing buggy block and placing correct block', () => {
            sandbox.innerHTML = `
                <div class="ai-socket" id="l3-sock"><div class="ai-block" data-type="correct">Score >= 50</div></div>
            `;
            const res = GenericValidator.validate(3, 0);
            assert(res.isValid, 'Debug replacement passes');
        });

        it('Validator: sequence-order checks multi-step ordering', () => {
            sandbox.innerHTML = `
                <div class="ai-stack-slot" id="l4-slot-1"><div data-step="s4-init"></div></div>
                <div class="ai-stack-slot" id="l4-slot-2"><div data-step="s4-calc"></div></div>
                <div class="ai-stack-slot" id="l4-slot-3"><div data-step="s4-label"></div></div>
                <div class="ai-stack-slot" id="l4-slot-4"><div data-step="s4-alert"></div></div>
            `;
            const res = GenericValidator.validate(4, 0);
            assert(res.isValid, 'Pipeline sequence matches correctly');
        });

        // ==========================================
        // 3. GAMIFICATION TESTS
        // ==========================================
        it('Gamification: 3-Star threshold requires >=100 score with no decoy', () => {
            const stats = { decoyUsesCount: 0, hintsUnlocked: [false, false, false] };
            const stars = Gamification.calculateStars(105, stats);
            assertEqual(stars, 3, 'Score >= 100 with no decoy yields 3 stars');
        });

        it('Gamification: Star degrades to 2 if decoy was triggered', () => {
            const stats = { decoyUsesCount: 1, hintsUnlocked: [false, false, false] };
            const stars = Gamification.calculateStars(105, stats);
            assertEqual(stars, 2, 'Decoy use prevents 3 stars');
        });

        it('Gamification: Streak increments on first attempt success', () => {
            Gamification.updateStreak(true);
            assert(Gamification.updateStreak(true) >= 2, 'Streak increments');
            Gamification.updateStreak(false);
            assertEqual(Gamification.updateStreak(false), 0, 'Streak resets to 0 on failure');
        });

        // ==========================================
        // 4. SECURITY & FORMATTING UTILS
        // ==========================================
        it('Security: sanitizeHTML prevents script injection', () => {
            const dirty = '<script>alert("hack")</script><b>Student</b>';
            const clean = Utils.sanitizeHTML(dirty);
            assert(!clean.includes('<script>'), 'Script tag stripped/escaped');
            assert(clean.includes('&lt;script&gt;'), 'Encoded correctly');
        });

        it('Utils: formatTime converts seconds to MM:SS', () => {
            assertEqual(Utils.formatTime(125), '02:05', 'Formats 125 seconds to 02:05');
        });

        // Run tests
        const listEl = document.getElementById('test-list');
        tests.forEach(t => {
            const item = document.createElement('div');
            item.className = 'test-item';
            try {
                t.fn();
                passed++;
                item.classList.add('pass');
                item.innerHTML = `
                    <div><div class="test-title">✓ ${t.name}</div></div>
                    <span class="badge pass">PASS</span>
                `;
            } catch (err) {
                failed++;
                item.classList.add('fail');
                item.innerHTML = `
                    <div>
                        <div class="test-title">✗ ${t.name}</div>
                        <div class="test-msg">${err.message}</div>
                    </div>
                    <span class="badge fail">FAIL</span>
                `;
            }
            listEl.appendChild(item);
        });

        document.getElementById('total-count').textContent = tests.length;
        document.getElementById('pass-count').textContent = passed;
        document.getElementById('fail-count').textContent = failed;
        const statusEl = document.getElementById('test-status');
        if (failed === 0) {
            statusEl.textContent = 'All Passed ✨';
            statusEl.style.color = '#34d399';
        } else {
            statusEl.textContent = `${failed} Failed`;
            statusEl.style.color = '#f43f5e';
        }
    </script>
</body>
</html>
